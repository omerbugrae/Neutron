<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neutron</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">NEUTRON</div>

      <nav>
        <button class="nav-item active">Genel Bakış</button>
        <button class="nav-item">Tarama</button>
        <button class="nav-item">Karantina</button>
        <button class="nav-item">Geçmiş</button>
        <button class="nav-item">Ayarlar</button>
      </nav>

      <div class="plan">STANDARD</div>
    </aside>

    <main class="content">
      <header>
        <div>
          <p class="eyebrow">SİSTEM DURUMU</p>
          <h1>Koruma etkin</h1>
          <p class="muted">Neutron cihazınızı izlemeye hazır.</p>
        </div>
        <span class="status">● Güvenli</span>
      </header>

      <section class="hero-card">
        <p>SON TARAMA</p>
        <h2>Henüz tarama yapılmadı</h2>
        <button class="scan-button">Hızlı tarama başlat</button>
      </section>
    </main>
  </body>
</html>
