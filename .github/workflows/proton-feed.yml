name: Proton threat-intelligence release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Proton sürümü; boş bırakılırsa yayımlanmış son sürümden türetilir (bkz. docs/proton-versioning.md)'
        required: false
        type: string
      limit:
        description: 'URLhaus kaynağı başına en fazla kayıt (1-1000)'
        required: false
        default: '1000'
        type: string
      bulk_limit:
        description: 'MalwareBazaar toplu tarama sorgusu başına kayıt (0-1000, 0 = kapalı)'
        required: false
        default: '1000'
        type: string
      threatfox_days:
        description: 'ThreatFox geriye dönük pencere, gün (1-7)'
        required: false
        default: '7'
        type: string
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: proton-feed-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NEUTRON_ABUSECH_AUTH_KEY: ${{ secrets.NEUTRON_ABUSECH_AUTH_KEY }}
      NEUTRON_PROTON_ENCRYPTION_KEY: ${{ secrets.NEUTRON_PROTON_ENCRYPTION_KEY }}
      NEUTRON_PROTON_SIGNING_PRIVATE_KEY: ${{ secrets.NEUTRON_PROTON_SIGNING_PRIVATE_KEY }}
      NEUTRON_PROTON_SIGNING_PUBLIC_KEY: ${{ secrets.NEUTRON_PROTON_SIGNING_PUBLIC_KEY }}
      PROTON_VERSION: ${{ inputs.version }}
      PROTON_LIMIT: ${{ inputs.limit || '1000' }}
      PROTON_BULK_LIMIT: ${{ inputs.bulk_limit || '1000' }}
      PROTON_THREATFOX_DAYS: ${{ inputs.threatfox_days || '7' }}
      # Hem sürüm türetme (gh api) hem de yayın oluşturma (gh release create) için gerekli.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$NEUTRON_ABUSECH_AUTH_KEY"
          test -n "$NEUTRON_PROTON_ENCRYPTION_KEY"
          test -n "$NEUTRON_PROTON_SIGNING_PRIVATE_KEY"
          test -n "$NEUTRON_PROTON_SIGNING_PUBLIC_KEY"

      - name: Write publishing keys
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/proton-keys" "$RUNNER_TEMP/proton-release"
          printf '%s\n' "$NEUTRON_PROTON_ENCRYPTION_KEY" > "$RUNNER_TEMP/proton-keys/proton-encryption.key"
          printf '%s\n' "$NEUTRON_PROTON_SIGNING_PRIVATE_KEY" > "$RUNNER_TEMP/proton-keys/proton-signing-private.pem"
          printf '%s\n' "$NEUTRON_PROTON_SIGNING_PUBLIC_KEY" > "$RUNNER_TEMP/proton-keys/proton-signing-public.pem"
          chmod 600 "$RUNNER_TEMP/proton-keys/proton-encryption.key" "$RUNNER_TEMP/proton-keys/proton-signing-private.pem"

      - name: Collect, verify, sign and publish Proton
        shell: bash
        run: |
          # Sürüm girilmemişse bayrak hiç eklenmez; araç yayımlanmış son sürümden türetir.
          version_argument=()
          if [ -n "$PROTON_VERSION" ]; then version_argument=(--version "$PROTON_VERSION"); fi
          node tools/proton/collect-and-publish.cjs \
            --source tools/proton/production-base/definitions.json \
            "${version_argument[@]}" \
            --limit "$PROTON_LIMIT" \
            --bulk-limit "$PROTON_BULK_LIMIT" \
            --threatfox-days "$PROTON_THREATFOX_DAYS" \
            --keys "$RUNNER_TEMP/proton-keys" \
            --output "$RUNNER_TEMP/proton-release" \
            --repo "${{ github.repository }}" \
            --persist-base

      # --persist-base yayimlanan adayi tools/proton/production-base/definitions.json uzerine yazdi;
      # bunu commit etmezsek bir sonraki calisma yine eski statik tabandan baslar ve surumler
      # birbirinin ust kumesi olma garantisini kaybeder (bkz. docs/proton-versioning.md).
      - name: Commit accumulated base
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- tools/proton/production-base/definitions.json; then
            echo 'Kaynak dosyada degisiklik yok, commit atlanacak.'
          else
            git add tools/proton/production-base/definitions.json
            git commit -m "Proton kaynagini yayimlanan surume gore guncelle [skip ci]"
            git push
          fi

      - name: Remove publishing keys
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/proton-keys"
